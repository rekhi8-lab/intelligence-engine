name: Intelligence Pipeline (every 2 days)

on:
  schedule:
    # 02:00 UTC on odd days (1st, 3rd, 5th...)
    - cron: "0 2 */2 * *"
  workflow_dispatch:
    inputs:
      youtube_channel:
        description: "New YouTube channel — Name | URL | mine / competitor / inspiration"
        required: false
        default: ""
      instagram_handle:
        description: "New Instagram handle — Name | @handle_or_URL | mine / competitor / inspiration"
        required: false
        default: ""
      linked_source:
        description: "New linked source/website — Name | URL | mine / competitor / inspiration"
        required: false
        default: ""
      insight:
        description: "Quick insight, note, or article summary for this run"
        required: false
        default: ""
      skip_inputs:
        description: "Skip input collection entirely and run immediately?"
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Get the code ──────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Pull latest data from Drive ───────────────────────
      - name: Download data from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python cloud_sync.py download

      # ── 4. Collect run inputs (Telegram + dispatch form) ────
      - name: Collect run inputs
        env:
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPATCH_YOUTUBE:            ${{ github.event.inputs.youtube_channel }}
          DISPATCH_INSTAGRAM:          ${{ github.event.inputs.instagram_handle }}
          DISPATCH_LINK:               ${{ github.event.inputs.linked_source }}
          DISPATCH_INSIGHT:            ${{ github.event.inputs.insight }}
          DISPATCH_SKIP:               ${{ github.event.inputs.skip_inputs }}
          GITHUB_EVENT_NAME:           ${{ github.event_name }}
          INPUT_TIMEOUT_SECS:          "300"
        run: python run_input_collector.py

      # ── 5. Run intelligence pipeline ─────────────────────────
      - name: Run intelligence pipeline
        env:
          CLAUDE_API_KEY:    ${{ secrets.CLAUDE_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
        run: python run_all.py

      # ── 6. Generate content drafts ───────────────────────────
      - name: Generate content drafts
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python content_generator.py

      # ── 7. Nervous System — synthesise intelligence into brief ─
      - name: Run nervous system
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python nervous_system.py

      # ── 7. Source Manager — sync sheet sources, analyse channels ─
      - name: Run source manager
        env:
          CLAUDE_API_KEY:              ${{ secrets.CLAUDE_API_KEY }}
          YOUTUBE_API_KEY:             ${{ secrets.YOUTUBE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          SOURCES_SHEET_ID:            ${{ secrets.SOURCES_SHEET_ID }}
        run: python source_manager.py

      # ── 8. Personal Inbox — process founder curated signals ──
      - name: Process personal inbox
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python personal_inbox_parser.py

      # ── 9. Prompt Engine — check data freshness, write nudges ─
      - name: Run prompt engine
        run: python prompt_engine.py

      # ── 10. Push updated data + outputs back to Drive ────────
      - name: Upload results to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python cloud_sync.py upload

      # ── 11. Summary ──────────────────────────────────────────
      - name: Print run summary
        run: |
          echo "Pipeline complete. New drafts and updated DB uploaded to Drive."
          echo "View at: https://drive.google.com/drive/folders/1tnU4bjFcLVdXx57yARwU__PVVvWoWPD1"
